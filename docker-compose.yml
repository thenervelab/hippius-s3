services:
  # The base image is where `pip install -e .` runs — every app image below is FROM it and only
  # COPYs source. So a new dependency in pyproject.toml does NOT reach a container until the base
  # is rebuilt: build this service, then `BASE_IMAGE=hippius-s3-base:latest docker compose build`.
  # Without that the app images layer onto the published base and the new import fails at runtime.
  base:
    image: hippius-s3-base:latest
    profiles:
      - build-base
    build:
      context: .
      dockerfile: Dockerfile.base

  api:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:8080:8000"
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-accounts:
        condition: service_healthy
      redis-rate-limiting:
        condition: service_healthy
      redis-queues:
        condition: service_healthy
    volumes:
      - .:/app
      # Shared object parts FS store (write-through cache)
      - /var/lib/hippius/object_cache:/var/lib/hippius/object_cache
      # General persistent storage (worklists, checkpoints, misc state)
      - /var/lib/hippius/persist:/var/lib/hippius/persist
      # KMS certificates for KEK wrapping (mTLS)
      - /var/lib/hippius/kms:/kms_certs:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hippius_net

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hippius
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hippius_net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--appendonly",
        "no",
        "--save",
        "",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    networks:
      - hippius_net

  redis-accounts:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_accounts_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--save",
        "60 1",
        "--save",
        "300 10",
        "--save",
        "900 100",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    networks:
      - hippius_net

  redis-rate-limiting:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6383:6379"
    volumes:
      - redis_rate_limiting_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command:
      ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "1gb"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    networks:
      - hippius_net

  redis-queues:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis_queues_data:/data
    command:
      [
        "redis-server",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    networks:
      - hippius_net

  redis-acl:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6384:6379"
    volumes:
      - redis_acl_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 30s
    networks:
      - hippius_net

  arion-uploader:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queues:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_arion_uploader_in_loop.py
      - ENABLE_WATCHFILES=true
      - HIPPIUS_ARION_BASE_URL=${HIPPIUS_ARION_BASE_URL:-https://arion.hippius.com/}
    volumes:
      - .:/app
      - /var/lib/hippius/object_cache:/var/lib/hippius/object_cache
      - /var/lib/hippius/kms:/kms_certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'from hippius_s3.config import get_config; get_config()'",
        ]
      # start_interval probes every 2s while the container is starting, so `up --wait` learns
      # about a dead-on-arrival worker as fast as the old 5s check did. Once healthy it backs off
      # to 30s: this spawns a python interpreter and imports the config each time, and at 5s
      # across four workers that was ~24% of a core burning continuously for no added signal.
      #
      # timeout is 45s, not the 10s this shipped with, because the probe's cost is wildly
      # arch-dependent. It imports the whole config module chain: ~0.3s on a native x86 runner,
      # but 8-10s idle and 38-60s under startup contention when the amd64 image runs under qemu
      # on an arm64 Mac. At 10s that flapped straight to `unhealthy` and `up --wait` failed, so
      # the local e2e stack was unusable on Apple Silicon while CI stayed green. Detection of a
      # genuinely wedged worker is correspondingly slower; that is the right trade against
      # breaking every arm64 developer.
      interval: 30s
      start_interval: 2s
      timeout: 45s
      retries: 3
      start_period: 30s
    networks:
      - hippius_net

  arion-unpinner:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queues:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'from hippius_s3.config import get_config; get_config()'",
        ]
      # start_interval probes every 2s while the container is starting, so `up --wait` learns
      # about a dead-on-arrival worker as fast as the old 5s check did. Once healthy it backs off
      # to 30s: this spawns a python interpreter and imports the config each time, and at 5s
      # across four workers that was ~24% of a core burning continuously for no added signal.
      #
      # timeout is 45s, not the 10s this shipped with, because the probe's cost is wildly
      # arch-dependent. It imports the whole config module chain: ~0.3s on a native x86 runner,
      # but 8-10s idle and 38-60s under startup contention when the amd64 image runs under qemu
      # on an arm64 Mac. At 10s that flapped straight to `unhealthy` and `up --wait` failed, so
      # the local e2e stack was unusable on Apple Silicon while CI stayed green. Detection of a
      # genuinely wedged worker is correspondingly slower; that is the right trade against
      # breaking every arm64 developer.
      interval: 30s
      start_interval: 2s
      timeout: 45s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_arion_unpinner_in_loop.py
      - ENABLE_WATCHFILES=true
    networks:
      - hippius_net

  purger:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queues:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'from hippius_s3.config import get_config; get_config()'",
        ]
      # start_interval probes every 2s while the container is starting, so `up --wait` learns
      # about a dead-on-arrival worker as fast as the old 5s check did. Once healthy it backs off
      # to 30s: this spawns a python interpreter and imports the config each time, and at 5s
      # across four workers that was ~24% of a core burning continuously for no added signal.
      #
      # timeout is 45s, not the 10s this shipped with, because the probe's cost is wildly
      # arch-dependent. It imports the whole config module chain: ~0.3s on a native x86 runner,
      # but 8-10s idle and 38-60s under startup contention when the amd64 image runs under qemu
      # on an arm64 Mac. At 10s that flapped straight to `unhealthy` and `up --wait` failed, so
      # the local e2e stack was unusable on Apple Silicon while CI stayed green. Detection of a
      # genuinely wedged worker is correspondingly slower; that is the right trade against
      # breaking every arm64 developer.
      interval: 30s
      start_interval: 2s
      timeout: 45s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_purger_in_loop.py
      - ENABLE_WATCHFILES=true
    networks:
      - hippius_net

  arion-downloader:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queues:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_arion_downloader_in_loop.py
      - ENABLE_WATCHFILES=true
      - HIPPIUS_ARION_BASE_URL=${HIPPIUS_ARION_BASE_URL:-https://arion.hippius.com/}
    volumes:
      - /var/lib/hippius/object_cache:/var/lib/hippius/object_cache
      - /var/lib/hippius/kms:/kms_certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'from hippius_s3.config import get_config; get_config()'",
        ]
      # start_interval probes every 2s while the container is starting, so `up --wait` learns
      # about a dead-on-arrival worker as fast as the old 5s check did. Once healthy it backs off
      # to 30s: this spawns a python interpreter and imports the config each time, and at 5s
      # across four workers that was ~24% of a core burning continuously for no added signal.
      #
      # timeout is 45s, not the 10s this shipped with, because the probe's cost is wildly
      # arch-dependent. It imports the whole config module chain: ~0.3s on a native x86 runner,
      # but 8-10s idle and 38-60s under startup contention when the amd64 image runs under qemu
      # on an arm64 Mac. At 10s that flapped straight to `unhealthy` and `up --wait` failed, so
      # the local e2e stack was unusable on Apple Silicon while CI stayed green. Detection of a
      # genuinely wedged worker is correspondingly slower; that is the right trade against
      # breaking every arm64 developer.
      interval: 30s
      start_interval: 2s
      timeout: 45s
      retries: 3
      start_period: 30s
    networks:
      - hippius_net

  janitor:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    env_file:
      - .env.defaults
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_janitor_in_loop.py
      - ENABLE_WATCHFILES=true
    volumes:
      - .:/app
      - /var/lib/hippius/object_cache:/var/lib/hippius/object_cache
    networks:
      - hippius_net


  account-cacher:
    build:
      context: .
      dockerfile: workers/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/thenervelab/hippius-s3/base:latest}
    depends_on:
      redis-accounts:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - WORKER_SCRIPT=workers/run_account_cacher_in_loop.py
      - ENABLE_WATCHFILES=true
    env_file:
      - .env.defaults
      - .env
    volumes:
      - .:/app
    networks:
      - hippius_net

volumes:
  postgres_data:
  redis_data:
  redis_accounts_data:
  redis_rate_limiting_data:
  redis_queues_data:
  redis_acl_data:

networks:
  hippius_net:
    external: true
    name: hippius_net
