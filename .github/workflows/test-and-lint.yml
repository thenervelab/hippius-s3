name: test-and-lint

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      # No `ref:` override — every job in this workflow must check out the SAME tree, and on a
      # pull_request that is actions/checkout's default: refs/pull/N/merge, i.e. the PR merged into
      # its base. That is what actually lands, so it is what CI should judge.
      #
      # This job used to pin `pull_request.head.sha` while the other six took the default, so lint
      # judged the branch and everything else judged the merge. A semantic conflict between a PR and
      # its base then showed up only in e2e and was unreproducible from the branch — see PR #437,
      # where a filter added on staging silently swallowed delete markers added on the PR.
      #
      # Prefer the default over an explicit `merge_commit_sha`: GitHub computes that field
      # asynchronously, so it can be stale or null on a fresh push.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Install Ruff 0.13.0
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.13.0"

      - name: Print environment info
        run: |
          python --version
          ruff --version

      - name: Lint (ruff check)
        run: |
          ruff check hippius_s3 || (
            echo "=== Ruff settings ===" && ruff check --show-settings | sed -n '1,200p' && exit 1
          )

      - name: Format (ruff format --check)
        run: |
          ruff format --check hippius_s3 || (
            echo "=== Ruff format DIFF (all) ===" && ruff format --diff hippius_s3 | sed -n '1,400p' || true
            exit 1
          )

  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          # Pinned: an unpinned install floats to the newest ty release, which
          # can start flagging pre-existing code and break unrelated PRs.
          uv tool install ty==0.0.43

      - name: Type check with ty
        run: |
          source .venv/bin/activate
          ty check hippius_s3

  dep-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run pip-audit
        # CVE-2026-3219 ignored until pip 26.1 ships to PyPI (fix merged in pypa/pip#13870).
        # Keep in sync with .pre-commit-config.yaml.
        run: |
          source .venv/bin/activate
          uv tool install pip-audit
          pip-audit --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-25645 --ignore-vuln CVE-2026-3219

  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Without this, every real-Postgres test in tests/integration self-skipped: the pg_conn
      # fixture skips when nothing is reachable, and each test_*_sql.py that opens its own
      # asyncpg connection skips on the resulting OSError. The whole SQL tier reported green
      # while executing nothing.
      #
      # postgres:17 matches the `rust` job below rather than prod's PG 15, so both jobs
      # exercise one server version; none of these tests depend on version-specific behavior.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The database name is load-bearing: tests/integration/conftest.py loads
          # .env.test-local with override=True, so the tests connect to
          # postgres:postgres@localhost:5432/hippius regardless of what this job exports.
          POSTGRES_DB: hippius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      # Exported for the migration step, which reads DATABASE_URL directly. The tests
      # themselves get the identical DSN from .env.test-local (see POSTGRES_DB above).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hippius?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      # The retry-mover tests spawn a throwaway redis-server because fakeredis cannot run Lua,
      # and they self-skip when the binary is absent. The runner image does not ship it, so
      # without this the atomic-claim regression guard silently never executes in CI.
      # psql applies the drain crate's migrations below.
      - name: Install redis-server and postgresql-client
        run: |
          # azure.archive.ubuntu.com periodically hangs mid-fetch on GH-hosted runners
          # (2026-08-19: three consecutive runs died to the 10-min job timeout INSIDE
          # `apt-get update`, pytest never started). Bound every fetch and retry, so a
          # dead mirror costs a bounded retry instead of the whole job.
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3"
          for i in 1 2 3; do
            timeout 180 sudo apt-get update $APT_OPTS && break
            echo "apt-get update attempt $i timed out or failed; retrying"
          done
          timeout 300 sudo apt-get install -y $APT_OPTS redis-server postgresql-client

      # hippius_s3.scripts.migrate shells out to dbmate, which the runner image does not ship
      # (the app image installs it in the Dockerfile).
      - name: Install dbmate 2.35.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/dbmate" \
            https://github.com/amacneil/dbmate/releases/download/v2.35.0/dbmate-linux-amd64
          chmod +x "$RUNNER_TEMP/dbmate"
          sudo mv "$RUNNER_TEMP/dbmate" /usr/local/bin/dbmate

      # Two independent migration systems own this one database, and the SQL tier needs both:
      # dbmate owns the app schema (hippius_s3/sql/migrations), while the drain crate owns the
      # cephor_* tables. In prod the drain's own sqlx applies the latter, so nothing else here
      # would create them. A reachable-but-unmigrated Postgres is worse than none at all — the
      # skip guards pass and every query then fails on a missing relation.
      - name: Apply database migrations
        run: |
          source .venv/bin/activate
          python -m hippius_s3.scripts.migrate
          for migration in crates/hippius-drain-core/migrations/*.sql; do
            echo "applying $migration"
            psql -v ON_ERROR_STOP=1 --single-transaction -q "$DATABASE_URL" -f "$migration"
          done

      - name: Run unit tests
        run: |
          mkdir -p reports
          source .venv/bin/activate
          pytest tests/unit -v --junitxml=reports/unit-junit.xml

      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v --junitxml=reports/integration-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-reports-${{ github.run_id }}
          path: reports/*.xml

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      HIPPIUS_KEY: ${{ secrets.HIPPIUS_KEY }}
      # Job-wide, not per-step: conftest's `docker compose up --build` rebuilds too, so both the
      # explicit build step and the pytest run must resolve the same locally-built base.
      BASE_IMAGE: hippius-s3-base:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Check Docker & Compose
        run: |
          docker --version
          docker compose version

      - name: Verify test environment files exist
        run: |
          test -f .env.defaults
          test -f .env.test-local
          test -f .env.test-docker

      - name: Prepare .env for docker-compose
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

      # BASE_IMAGE (job env) points the app images at the base we just built from THIS commit's
      # pyproject.toml. Without it they layer onto the published base and any dependency added in
      # the PR is missing at runtime — the api container then fails to import and goes unhealthy.
      - name: Build Docker images
        run: |
          docker compose --profile build-base -f docker-compose.yml -f docker-compose.e2e.yml build base
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml build

      - name: Run E2E tests
        run: |
          mkdir -p reports artifacts
          source .venv/bin/activate
          pytest tests/e2e -v --maxfail=1 --junitxml=reports/e2e-junit.xml

      - name: Collect diagnostics (docker ps, logs)
        if: always()
        run: |
          echo "== docker compose ps ==" > artifacts/ps.txt
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps >> artifacts/ps.txt || true
          echo "== docker compose logs ==" > artifacts/docker-compose.log
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color >> artifacts/docker-compose.log || true
          docker images --digests > artifacts/images.txt || true

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            reports/e2e-junit.xml
            artifacts/**

      - name: Cleanup docker compose
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      # The drain's #[sqlx::test] cases auto-create per-test DBs against this and apply
      # the cephor_* migrations, so schema + queries (incl node-scoped claim) are exercised.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The coordination/tick/allocator/runtime tests need a real Redis (no fakeredis in
      # Rust) and are #[ignore]d so a redis-less local run shows them as ignored, not
      # passed. One shared instance + DB 0 is enough: each test prefixes its keys with the
      # process id + a per-test prefix, so parallel cases never collide.
      CEPHOR_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0 (pinned to the builder toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (pure + Postgres + Redis-gated coordination tiers)
        # --include-ignored runs the #[ignore]d redis-gated coordination tests (fencing,
        # leader election, lease/heartbeat expiry, budget apply/decay) now that a Redis
        # service is present; without it CI covered none of them while showing green.
        run: cargo test --workspace --all-features --locked -- --include-ignored

  rust-deny:
    name: Rust (cargo-deny supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run cargo-deny on the runner's gnu toolchain (installed per rust-toolchain.toml)
      # rather than the EmbarkStudios action, whose musl container lacks the toolchain.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny check
        run: cargo deny check
