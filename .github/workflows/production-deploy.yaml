name: production-deploy

on:
  push:
    branches:
      - k8s-production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/hippius-s3

jobs:
  build-base:
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.base-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          outputs: type=registry,oci-mediatypes=true,compression=gzip,compression-level=9

      - name: Set base image output
        id: base-image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base:$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build-images:
    runs-on: ubuntu-latest
    needs: build-base
    strategy:
      matrix:
        service: [api, gateway, workers]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            echo "dockerfile=./Dockerfile" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "gateway" ]; then
            echo "dockerfile=./gateway/Dockerfile" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "workers" ]; then
            echo "dockerfile=./workers/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rust-gate:
    # Block the drain image build (and thus the deploy) on the Rust quality gates
    # (audit F2). Fast checks only -- fmt + clippy + supply chain; the full
    # Postgres-backed test suite runs in the PR workflow (test-and-lint.yml).
    name: Rust gate (fmt, clippy, cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny check
        run: cargo deny check

  build-drain:
    # The hippius-drain Rust binaries (agent + allocator) ship as one `drain` image.
    # It is a self-contained Cargo workspace, so it needs no base image. Gated on
    # rust-gate so a clippy/fmt/advisory failure blocks building+deploying the drain.
    # (Prod parity with staging-deploy.yaml; no chaos-mesh/toxiproxy here — that is staging-only.)
    needs: rust-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/drain
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push drain image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.drain
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, build-drain]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Create namespace if needed
        run: |
          kubectl create namespace hippius-s3-prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Update secrets
        run: |
          DATABASE_URL="postgresql://postgres:${{ secrets.DATABASE_PASSWORD }}@postgres-nvme-rw:5432/hippius?sslmode=disable"

          kubectl create secret generic hippius-s3-secrets \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=HIPPIUS_KEYSTORE_DATABASE_URL="${DATABASE_URL}" \
            --from-literal=REDIS_URL="redis://redis-cluster.hippius-s3-prod.svc.cluster.local:6379?cluster=true" \
            --from-literal=REDIS_ACCOUNTS_URL="redis://redis-accounts:6379/0" \
            --from-literal=REDIS_QUEUES_URL="redis://redis-queues:6379/0" \
            --from-literal=REDIS_RATE_LIMITING_URL="redis://redis-rate-limiting:6379/0" \
            --from-literal=REDIS_ACL_URL="redis://redis-acl:6379/0" \
            --from-literal=HIPPIUS_SERVICE_KEY="${{ secrets.HIPPIUS_SERVICE_KEY }}" \
            --from-literal=ARION_SERVICE_KEY="${{ secrets.ARION_SERVICE_KEY }}" \
            --from-literal=ARION_BEARER_TOKEN="${{ secrets.ARION_BEARER_TOKEN }}" \
            --from-literal=ARION_BILLING_BYPASS_KEY="${{ secrets.ARION_BILLING_BYPASS_KEY }}" \
            --from-literal=ARION_RATE_LIMITING_PROXY_BYPASS_KEY="${{ secrets.ARION_RATE_LIMITING_PROXY_BYPASS_KEY }}" \
            --from-literal=HIPPIUS_AUTH_ENCRYPTION_KEY="${{ secrets.HIPPIUS_AUTH_ENCRYPTION_KEY }}" \
            --from-literal=DATABASE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}" \
            --from-literal=HIPPIUS_UPLOAD_QUEUE_NAMES="${{ secrets.HIPPIUS_UPLOAD_QUEUE_NAMES }}" \
            --from-literal=HIPPIUS_DOWNLOAD_QUEUE_NAMES="${{ secrets.HIPPIUS_DOWNLOAD_QUEUE_NAMES }}" \
            --from-literal=FRONTEND_HMAC_SECRET="${{ secrets.FRONTEND_HMAC_SECRET }}" \
            --from-literal=DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK_URL }}" \
            --from-literal=HIPPIUS_OVH_KMS_ENDPOINT="${{ secrets.HIPPIUS_OVH_KMS_ENDPOINT }}" \
            --from-literal=HIPPIUS_OVH_KMS_DEFAULT_KEY_ID="${{ secrets.HIPPIUS_OVH_KMS_DEFAULT_KEY_ID }}" \
            --from-literal=HIPPIUS_OVH_KMS_OKMS_ID="${{ secrets.HIPPIUS_OVH_KMS_OKMS_ID }}" \
            --from-literal=HIPPIUS_UPLOAD_BACKENDS="${{ secrets.HIPPIUS_UPLOAD_BACKENDS }}" \
            --from-literal=HIPPIUS_DOWNLOAD_BACKENDS="${{ secrets.HIPPIUS_DOWNLOAD_BACKENDS }}" \
            --from-literal=HIPPIUS_DELETE_BACKENDS="${{ secrets.HIPPIUS_DELETE_BACKENDS }}" \
            --from-literal=ATS_CACHE_ENDPOINT="${{ secrets.ATS_CACHE_ENDPOINT }}" \
            --from-literal=HIPPIUS_AUTH_PROBE_SECRET="${{ secrets.HIPPIUS_AUTH_PROBE_SECRET }}" \
            --from-literal=HIPPIUS_UPLOADER_MAX_INFLIGHT="${{ secrets.HIPPIUS_UPLOADER_MAX_INFLIGHT || '4' }}" \
            --from-literal=HIPPIUS_UNPINNER_MAX_INFLIGHT="${{ secrets.HIPPIUS_UNPINNER_MAX_INFLIGHT || '4' }}" \
            --namespace=hippius-s3-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create postgres superuser secret
        run: |
          kubectl create secret generic postgres-superuser \
            --from-literal=username=postgres \
            --from-literal=password='${{ secrets.DATABASE_PASSWORD }}' \
            --namespace=hippius-s3-prod \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret postgres-superuser cnpg.io/reload=true \
            --namespace=hippius-s3-prod --overwrite

      - name: Create postgres backup credentials
        run: |
          kubectl create secret generic postgres-backup-creds \
            --from-literal=ACCESS_KEY_ID='${{ secrets.OVH_BACKUP_ACCESS_KEY_ID }}' \
            --from-literal=ACCESS_KEY_SECRET='${{ secrets.OVH_BACKUP_SECRET_ACCESS_KEY }}' \
            --namespace=hippius-s3-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute backup configuration values
        run: |
          sed -i "s|OVH_BACKUP_BUCKET_PLACEHOLDER|${{ secrets.OVH_BACKUP_BUCKET }}|g" k8s/production/postgres-nvme-objectstore.yaml
          sed -i "s|OVH_BACKUP_ENDPOINT_URL_PLACEHOLDER|${{ secrets.OVH_BACKUP_ENDPOINT_URL }}|g" k8s/production/postgres-nvme-objectstore.yaml

      - name: Substitute Arion configuration values
        run: |
          ARION_URL="${{ secrets.HIPPIUS_ARION_BASE_URL }}"
          ARION_SSL="${{ secrets.HIPPIUS_ARION_VERIFY_SSL }}"
          sed -i "s|HIPPIUS_ARION_BASE_URL_PLACEHOLDER|${ARION_URL:-https://arion.hippius.com/}|g" k8s/base/workers-deployments.yaml
          sed -i "s|HIPPIUS_ARION_VERIFY_SSL_PLACEHOLDER|${ARION_SSL:-true}|g" k8s/base/workers-deployments.yaml

      - name: Substitute Sentry DSN
        run: |
          sed -i "s|SENTRY_DSN_PLACEHOLDER|${{ secrets.SENTRY_DSN }}|g" k8s/production/environment-patch.yaml

      - name: Update image tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd k8s/production
          kustomize edit set image \
            ghcr.io/thenervelab/hippius-s3/api:${SHORT_SHA} \
            ghcr.io/thenervelab/hippius-s3/gateway:${SHORT_SHA} \
            ghcr.io/thenervelab/hippius-s3/workers:${SHORT_SHA} \
            ghcr.io/thenervelab/hippius-s3/drain:${SHORT_SHA}

      - name: Delete old migration job
        run: |
          kubectl delete job db-migrations -n hippius-s3-prod --ignore-not-found=true

      - name: Deploy Redis cluster
        run: |
          kubectl apply -f k8s/redis-cluster/production.yaml

      # Applied server-side in its own step — NOT folded into `apply -k` below — so prod
      # and staging cannot prune each other's node label. Client-side apply does prune it:
      # on 2026-07-22 a staging deploy stripped s3-prod-local-ingest from node2/node3 and
      # stranded 243 prod parts, then a prod deploy stripped s3-staging-local-ingest back
      # and took staging's ingest tier to 0. Full rationale + the retire-a-node checklist
      # live in the manifest header.
      - name: Label ingest nodes (server-side)
        run: |
          kubectl apply --server-side --force-conflicts \
            --field-manager=hippius-s3-prod-ingest-labels \
            -f k8s/production/ingest-node-labels-production.yaml

      - name: Deploy to production
        run: |
          kubectl apply -k k8s/production

      - name: Wait for rollout
        run: |
          ns=hippius-s3-prod
          # Wait on a Deployment only if it exists — the overlay changes shape across the cutover
          # (monolith `api` only → hybrid `api`+`api-local` → drain-direct `api-local`+drain stack),
          # so a hard wait on a not-yet-present Deployment would fail an otherwise-good deploy.
          wait_deploy() {
            if kubectl get deployment/"$1" -n "$ns" >/dev/null 2>&1; then
              kubectl rollout status deployment/"$1" -n "$ns" --timeout="${2:-10m}"
            else
              echo "deployment/$1 absent — skipping"
            fi
          }
          # Absolute size of the ingest tier, from the Node stanzas in the label file — the
          # declarative source of truth for `s3-prod-local-ingest=true`. Both api-local and
          # drain-agent are DaemonSets over that label, so a Ready count below it means the tier
          # is serving degraded. This is deliberately an ABSOLUTE check: the drain-agent-vs-api-local
          # test below only catches ASYMMETRY, and on 2026-07-22 the label was pulled from two nodes,
          # shrinking BOTH DaemonSets to 3 together — that test passed (3==3, 3>=3) while the tier
          # ran at 60% capacity for two hours with nothing alerting.
          ingest_expected=$(grep -c '^kind: Node' k8s/production/ingest-node-labels-production.yaml 2>/dev/null || true)
          ingest_expected=${ingest_expected:-0}
          assert_ingest_tier() {
            ready=$(kubectl get ds "$1" -n "$ns" -o jsonpath='{.status.numberReady}' 2>/dev/null || echo 0)
            echo "$1 Ready=${ready:-0}/${ingest_expected} labelled ingest nodes"
            if [ "${ingest_expected:-0}" -gt 0 ] && [ "${ready:-0}" -lt "${ingest_expected}" ]; then
              echo "::error::$1 Ready ${ready:-0}/${ingest_expected} — ingest tier degraded. Verify every node in ingest-node-labels-production.yaml still carries s3-prod-local-ingest=true."
              kubectl get nodes -l s3-prod-local-ingest=true || true
              kubectl get pods -l app="$1" -n "$ns" -o wide || true
              exit 1
            fi
          }
          kubectl rollout status deployment/gateway -n "$ns" --timeout=10m
          # api (monolith / hybrid base) and api-local (drain-direct) — whichever exist.
          wait_deploy api 10m
          # api-local is a DaemonSet (one pod per ingest node). Wait on it, then prune the
          # pre-DaemonSet Deployment of the same name: kustomize can't change a resource's kind
          # in place, so the old Deployment/api-local lingers after the first DaemonSet apply and
          # both would serve behind app=api-local. Delete AFTER the DaemonSet is Ready (no capacity
          # dip); idempotent — a no-op on every deploy after the conversion lands.
          if kubectl get daemonset/api-local -n "$ns" >/dev/null 2>&1; then
            kubectl rollout status daemonset/api-local -n "$ns" --timeout=10m
            kubectl delete deployment/api-local -n "$ns" --ignore-not-found=true
            assert_ingest_tier api-local
          else
            wait_deploy api-local 10m
          fi
          kubectl rollout status deployment/arion-downloader -n "$ns" --timeout=10m
          kubectl rollout status deployment/arion-uploader -n "$ns" --timeout=10m
          # Drain stack (allocator-first: it applies the cephor_* migrations on startup). Present
          # only once the drain block is uncommented in kustomization.yaml (at cutover).
          wait_deploy drain-allocator 5m
          wait_deploy mpu-reaper 5m
          # drain-agent is a DaemonSet that MUST cover every node running api-local: a node with
          # api-local but no drain-agent silently drops that node's uploads (never drained) — peer
          # review B3. A partial roll is therefore a FAILURE, not a warning. The s3-ingest-priority
          # class ensures the agent can preempt for a slot, so a partial roll is a real problem now.
          # Require drain-agent numberReady == desiredNumberScheduled AND >= the api-local node count.
          if kubectl get ds/drain-agent -n "$ns" >/dev/null 2>&1; then
            kubectl rollout status daemonset/drain-agent -n "$ns" --timeout=10m || true
            ready=$(kubectl get ds drain-agent -n "$ns" -o jsonpath='{.status.numberReady}' 2>/dev/null || echo 0)
            desired=$(kubectl get ds drain-agent -n "$ns" -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null || echo 0)
            apiloc=$(kubectl get pods -l app=api-local -n "$ns" --field-selector=status.phase=Running -o json 2>/dev/null | jq -r '[.items[].spec.nodeName]|unique|length' 2>/dev/null || echo 0)
            echo "drain-agent ready=${ready}/${desired}; api-local nodes=${apiloc}"
            if [ "${ready:-0}" -lt "${desired:-1}" ] || [ "${ready:-0}" -lt "${apiloc:-0}" ]; then
              echo "::error::drain-agent partial (${ready}/${desired}, api-local on ${apiloc} nodes) — a node runs api-local with NO drain-agent (dark uploads). FAILING the deploy."
              kubectl get pods -l app=drain-agent -n "$ns" -o wide || true
              exit 1
            fi
            echo "drain-agent covers every api-local node ✅"
            assert_ingest_tier drain-agent
          else
            echo "daemonset/drain-agent absent — drain block not yet enabled; skipping"
          fi

      - name: Restart external deployments
        run: |
          kubectl rollout restart deployment/hydrator -n hippius-s3-prod --ignore-not-found || true
          kubectl rollout restart deployment/backup -n hippius-s3-prod --ignore-not-found || true

      - name: Verify deployment
        run: |
          kubectl get pods -n hippius-s3-prod
          kubectl get services -n hippius-s3-prod
          kubectl get ingress -n hippius-s3-prod
