# Standalone reference PoC — deliberately NOT a member of the repo's Cargo workspace.
[workspace]

[package]
name = "ctx_poc"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
sha2 = "0.10"
blake3 = "1"
subtle = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
