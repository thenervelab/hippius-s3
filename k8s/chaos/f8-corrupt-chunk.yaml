# F8 — corrupt / partial chunk on SSD.
# PRIMARY mechanism is the toxiproxy `limit_data` toxic (a truncated backend body — see
# stress-test/faults/matrix.yaml F8 and tests/e2e/support/compose.py:add_toxic("arion","limit_data",...)):
# deterministic, container-local, and never touches the shared mount. This IOChaos is an OPT-IN,
# tightly-scoped alternative that corrupts REAL bytes on reads inside a SINGLE disposable
# drain-agent container's ingest path.
#
# Gate: the agent's per-chunk verify re-hashes the copy, the hash mismatches, and the part is marked
# Failed/Corrupt and NEVER committed as `replicated`; blast radius = 1 part; detect <=5s; reclaim <=1h.
#
# Why `action: mistake` (not the previous `attrOverride`): mistake actually alters the bytes a reader
# RECEIVES from read(2) — it overwrites up to `maxLength` bytes at up to `maxOccurrences` random offsets
# in each matched read's RESULT with random fill, so a re-read almost certainly hashes differently from
# the source. `attrOverride` only chmod'd the file (`perm: 0644`); it flipped ZERO bytes, so verify
# always passed and the corrupt-detection path was never exercised — a no-op masquerading as corruption.
#
# SAFETY: `mistake` corrupts only the DATA RETURNED to a reader; it does NOT persist to the file at
# rest — the on-disk bytes stay intact, so blast radius is a single in-flight read on this one
# container, not durable data. Even so, keep it disposable: `volumePath`/`path` MUST point at a
# DISPOSABLE agent's local ingest dir, never the shared CephFS pool mount. Confirm the target is a
# throwaway node before applying.
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: f8-corrupt-chunk
  namespace: hippius-s3-staging
spec:
  action: mistake
  mode: one
  duration: 30s
  selector:
    namespaces:
      - hippius-s3-staging
    labelSelectors:
      app: drain-agent
  volumePath: /var/lib/hippius/local_object_cache
  path: /var/lib/hippius/local_object_cache/**
  containerNames:
    - agent
  methods:
    - read
  percent: 100
  mistake:
    filling: random # zero | random — random makes the re-read hash diverge with overwhelming probability
    maxOccurrences: 1
    maxLength: 16
