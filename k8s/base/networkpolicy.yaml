apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # Allow cache namespaces to access PG cross-namespace
        - namespaceSelector:
            matchLabels:
              hippius.io/role: cache
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-monitoring-system
      ports:
        - port: 8889
          protocol: TCP
        # CNPG per-instance metrics exporter — scraped by the 'cnpg' Prometheus job
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8889
          protocol: TCP
        # CNPG per-instance metrics exporter — scraped by the 'cnpg' Prometheus job
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP

  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
---
# Public entry for the merged api. Scoped to the edge-labeled pods only, so the
# hippius.io/edge rollout latch holds at the CNI layer too — a pod without the
# label (e.g. a pre-merge image mid-roll) is unreachable from outside even if a
# Service were to select it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-edge
spec:
  podSelector:
    matchLabels:
      hippius.io/edge: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 8000
          protocol: TCP
