apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
# The gateway service survives the gateway/api merge as an alias: in-cluster
# clients and the ingress keep resolving gateway:8080, served by the merged api.
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ExternalName
  externalName: redis.redis.svc.cluster.local
