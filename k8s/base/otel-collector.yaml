# The otel-collector ConfigMap is NOT here — it is generated from otel-config.yaml by the
# configMapGenerator in kustomization.yaml, which appends a content hash to its name.
# That hash is what makes a config change actually take effect: the collector reads its
# config ONCE at startup, and with a fixed ConfigMap name `kubectl apply -k` updates the
# ConfigMap while leaving the running pod untouched. Prod sat 37 days on a stale config
# that way (pod started 2026-06-15, ConfigMap last applied 2026-07-22), silently forcing
# service.name=hippius-s3 onto every workload because the loaded copy still said `upsert`.
# With the hash in the name, changing otel-config.yaml renames the ConfigMap, which changes
# the volume reference, which rolls the pod. Do not pin the name back.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - --config=/etc/otelcol-contrib/otel-config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: prometheus
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 8889
      targetPort: 8889
      name: prometheus
