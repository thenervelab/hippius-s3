apiVersion: v1
kind: ConfigMap
metadata:
  name: hippius-s3-defaults
data:
  MAX_REQUEST_SIZE_MB: "100"
  MIN_BUCKET_NAME_LENGTH: "3"
  MAX_BUCKET_NAME_LENGTH: "100"
  MAX_OBJECT_KEY_LENGTH: "1024"
  MAX_METADATA_SIZE: "200"
  LOG_LEVEL: "INFO"
  LOKI_ENABLED: "false"
  ENABLE_MONITORING: "true"
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_API_DOCS: "true"
  ENABLE_REQUEST_PROFILING: "false"
  HIPPIUS_BYPASS_CREDIT_CHECK: "false"
  HIPPIUS_SUBSTRATE_URL: "wss://rpc.hippius.network"
  HIPPIUS_VALIDATOR_REGION: "decentralized"
  HIPPIUS_UPLOADER_MAX_ATTEMPTS: "7"
  HIPPIUS_UPLOADER_BACKOFF_BASE_MS: "500"
  HIPPIUS_UPLOADER_BACKOFF_MAX_MS: "60000"
  HIPPIUS_UNPINNER_MAX_ATTEMPTS: "5"
  HIPPIUS_UNPINNER_BACKOFF_BASE_MS: "1000"
  HIPPIUS_UNPINNER_BACKOFF_MAX_MS: "60000"
  # Batch unpin deletes via HCFS POST /delete_files (up to 1000 file deletes per HTTP call) to drain
  # the arion_unpin_requests backlog. Auto-falls back to per-file if the endpoint 404s. Verified on
  # staging (see docs/issues/unpinner-batch-delete.md).
  HIPPIUS_UNPINNER_BATCH_DELETE: "true"
  ORPHAN_CHECKER_LOOP_SLEEP: "7200"
  ORPHAN_CHECKER_BATCH_SIZE: "100"
  HIPPIUS_ORPHAN_WORKER_ACCOUNT_WHITELIST: ""
  # Janitor stale-parts reap window and, where the mpu-reaper runs, the incomplete-MPU
  # auto-abort window. Lowered from the 2-day code default to 1 day to reclaim NVMe cache
  # faster (hard-deleted orphan residue dominates resident dirs). Do not shorten further
  # without splitting the janitor knob from the MPU-abort knob: uploads open past this
  # window get auto-aborted, and multi-GB backups can legitimately run for many hours.
  HIPPIUS_MPU_STALE_SECONDS: "86400"
  # Under ELEVATED pressure the janitor keeps rotating a small shard count instead of one
  # budget-truncated whole-tree walk that never reaches the readdir tail; CRITICAL still forces
  # shards=1 + unbounded budget. The pressure sleep replaces the 120s dead time per ~600s cycle
  # exactly when eviction throughput matters most.
  HIPPIUS_JANITOR_ELEVATED_WALK_SHARDS: "8"
  HIPPIUS_JANITOR_PRESSURE_SLEEP_SECONDS: "15"
  # SQL-driven eviction discovery: inventory ROWS SCANNED per keyset page (the slice window that is
  # then filtered for evictability — not the candidate count), and the per-cycle delete budget. Set
  # the budget to 0 to disable the phase without a deploy (prod rollback kill switch); the unified
  # walk remains the full eviction engine when it is off.
  HIPPIUS_JANITOR_SQL_PAGE_SIZE: "1000"
  HIPPIUS_JANITOR_SQL_MAX_DELETES_PER_CYCLE: "50000"
  # Per-page discovery query timeout. A sparse ring can make one keyset page scan the whole
  # inventory; on timeout, discovery ends this cycle with the cursor at the last completed page
  # and resumes there next cycle (never advances/resets past an incomplete page).
  HIPPIUS_JANITOR_SQL_QUERY_TIMEOUT_SECONDS: "30"
  HTTP_STREAM_INITIAL_TIMEOUT_SECONDS: "0.5"
  HIPPIUS_DLQ_DIR: "/tmp/hippius_dlq"
  HIPPIUS_DLQ_ARCHIVE_DIR: "/tmp/hippius_dlq_archive"
  # These pool bounds are PER UVICORN WORKER (asyncpg pools are per process), and the
  # api runs UVICORN_WORKERS=4 — so a pod's ceiling is 4x MAX_SIZE and its idle floor is
  # 4x MIN_SIZE. The previous value (40) was reasoned as if a pod held ONE pool: "the
  # merged app absorbs the gateway's per-request DB work (bucket-owner lookups,
  # sub-token scopes, account state), so 40 replaces the gateway's deleted 5x40 pools".
  # At 4 workers that math was wrong by 4x: prod potential became 5 nodes x 4 x 40 = 800
  # backends for api-local alone, against max_connections=1000 shared with the uploader
  # fleet (40x8=320 cap), drain, janitor, and replicas — a burst away from PG refusing
  # connections. 15/worker (pod ceiling 60, prod api ceiling 300) is plenty: a single
  # event loop holds only short acquires and rarely needs >10 concurrent; min 3 keeps
  # the idle floor at 12/pod instead of 20.
  API_DB_POOL_MIN_SIZE: "3"
  API_DB_POOL_MAX_SIZE: "15"
  API_DB_POOL_MAX_QUERIES: "50000"
  API_DB_POOL_MAX_INACTIVE_LIFETIME: "300"
  API_DB_POOL_COMMAND_TIMEOUT: "30"
  # Per-uploader-pod DB pool cap. Multiplied by the uploader replica count against
  # Postgres max_connections (40 pods x 8 = 320). Capped to keep total backends well
  # under max_connections=1000 and limit per-backend page-table memory. See cnpg.md.
  HIPPIUS_UPLOADER_DB_POOL_MAX: "8"
  CACHET_API_URL: "http://cachet.monitoring.svc.cluster.local"
  BACKUP_INTERVAL_HOURS: "24"
  BACKUP_RETENTION_COUNT: "30"
  HIPPIUS_API_BASE_URL: "https://api.hippius.com/api"
  ACL_CACHE_TTL_SECONDS: "600"
  ENABLE_PUBLIC_READ: "true"
  PUBLISH_TO_CHAIN: "true"
  ENABLE_STRICT_VALIDATION: "true"
  HIPPIUS_TARGET_STORAGE_VERSION: "5"
  HIPPIUS_PINNER_CONSUME_QUEUE: "upload_requests"
  HIPPIUS_KMS_MODE: "required"
  HIPPIUS_OVH_KMS_CERT_PATH: "/kms_certs/client.crt"
  HIPPIUS_OVH_KMS_KEY_PATH: "/kms_certs/client.key"
  UVICORN_WORKERS: "4"
  # In-process worker recycling disabled (0): --limit-max-requests churns a worker while
  # the pod stays Ready, so the ATS edge routes into the restart window and gets a 502
  # "Next Hop Connection Failed". Prod memory is flat at ~10-15% of the pod limit with
  # zero OOMs, so it bought nothing. Re-enable (>0) only if a real leak appears.
  UVICORN_MAX_REQUESTS: "0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "cumulative"
  HIPPIUS_OBJECT_CACHE_FALLBACK_DIR: ""
  SENTRY_DSN: ""
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
