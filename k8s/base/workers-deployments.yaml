apiVersion: apps/v1
kind: Deployment
metadata:
  name: janitor

spec:
  replicas: 1
  selector:
    matchLabels:
      app: janitor
  template:
    metadata:
      labels:
        app: janitor
        worker-type: janitor
    spec:
      # Workers take no inbound traffic, so there is no preStop endpoint-propagation wait —
      # this is purely drain headroom. run_worker() cancels the loop on SIGTERM and bounds the
      # cleanup at HIPPIUS_WORKER_DRAIN_TIMEOUT_SECONDS (20s), and that cleanup closing the
      # asyncpg pool is what stops a long statement outliving the pod and pinning the xmin
      # horizon. 40 leaves headroom over the 20s bound.
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: wait-for-services
          image: busybox:1.35
          command:
            - sh
            - -c
            - until nc -z postgres-rw 5432 && nc -z redis 6379; do echo waiting for services; sleep 5; done
        # D2: gate on DB migrations (see the uploader deployment for the rationale) — the janitor
        # reads object_versions/parts/chunk_backend and must not run against a stale schema.
        - name: wait-for-migrations
          image: ghcr.io/thenervelab/hippius-s3/workers:latest
          command:
            - python
            - scripts/wait_for_migrations.py
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
      containers:
        - name: janitor
          image: ghcr.io/thenervelab/hippius-s3/workers:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: hippius-s3-defaults
            - configMapRef:
                name: hippius-s3-environment
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(ENVIRONMENT),service.namespace=$(K8S_NAMESPACE),service.instance.id=$(POD_NAME)"
            - name: OTEL_SERVICE_NAME
              value: "hippius-s3-janitor"
            - name: WORKER_SCRIPT
              value: "workers/run_janitor_in_loop.py"
            # Pool-fullness gate (2026-07-24 incident). statvfs on the cache PVC sees the CephFS
            # quota (~69%), not the backing pool (~94%), so the janitor stayed in Normal mode as
            # the pool filled to the read-only cliff. These make _pressure_mode take max(statvfs,
            # fullest pool %USED) from the mgr exporter — the same signal + pools the drain
            # allocator uses (CEPHOR_CEPH_*). Cross-namespace reach to rook-ceph confirmed.
            - name: HIPPIUS_JANITOR_CEPH_MGR_METRICS_URL
              value: "http://rook-ceph-mgr.rook-ceph.svc.cluster.local:9283/metrics"
            - name: HIPPIUS_JANITOR_CEPH_POOLS
              value: "ceph-filesystem-data0,ceph-filesystem-metadata,ceph-blockpool"
            # Hot-retention window = 4h (2026-07-24 incident follow-up). The janitor evicts by a
            # binary atime threshold in walk order (no LRU), so the window IS the working-set
            # protection: anything read inside it is kept. The emergency value set during the acute
            # climb was 900s → 450s at elevated pressure — short enough that the live working set
            # looked "cold", got evicted, then re-read + re-fetched (the refill flywheel), pinning
            # the pool full without freeing real space. 4h (2h effective at elevated) protects the
            # working set so only the genuinely-cold tail is evicted and STAYS evicted. Backs up
            # what was a live `set env` override so the manifest is the source of truth (was drift).
            - name: HIPPIUS_FS_CACHE_HOT_RETENTION_SECONDS
              value: "14400"
            # Walk throughput (2026-07-24 incident follow-up). The eviction limiter is COVERAGE,
            # not eligibility: a cycle deletes ~54% of the parts it walks, but the budget truncates
            # the crawl long before it reaches the whole ~2.8M-object tree, so raising these is what
            # actually frees more space. Doubling the crawl (8→16) and lengthening the budget
            # (480s→1200s) measured ~2.5x the deletes per cycle (11k→28k, objects_scanned 19k→44k)
            # with NO impact on live reads (held at 1.6 GiB/s; the MDS was not saturated).
            # CAUTION: the walk shares the CephFS MDS with live GET/PUT — raise further only while
            # watching MDS req/s and read latency. Backs up live `set env` overrides (was drift).
            - name: HIPPIUS_JANITOR_WALK_CONCURRENCY
              value: "16"
            - name: HIPPIUS_JANITOR_WALK_BUDGET_SECONDS
              value: "1200"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_URL
            - name: REDIS_QUEUES_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_QUEUES_URL
            - name: HIPPIUS_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_SERVICE_KEY
            - name: ARION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_SERVICE_KEY
            - name: ARION_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_BEARER_TOKEN
            - name: HIPPIUS_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_AUTH_ENCRYPTION_KEY
            - name: FRONTEND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: FRONTEND_HMAC_SECRET
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: HIPPIUS_OVH_KMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_ENDPOINT
            - name: HIPPIUS_OVH_KMS_DEFAULT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_DEFAULT_KEY_ID
            - name: HIPPIUS_OVH_KMS_OKMS_ID
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_OKMS_ID
            # Must match the api/uploader fleet (arion,ovh). The janitor uses this for
            # the replication-gate fallback (empty-upload_backends versions) and to
            # enumerate every upload backend's DLQ for deletion protection. Defaulting
            # to ["arion"] silently skipped the ovh DLQ and under-required the gate.
            - name: HIPPIUS_UPLOAD_BACKENDS
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_UPLOAD_BACKENDS
          volumeMounts:
            - name: object-cache
              mountPath: /var/lib/hippius/object_cache
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: object-cache
          persistentVolumeClaim:
            claimName: object-cache-pvc
