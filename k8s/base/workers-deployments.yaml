apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-uploader

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arion-uploader
  template:
    metadata:
      labels:
        app: arion-uploader
        worker-type: uploader
        backend: arion
    spec:
      # Workers take no inbound traffic, so there is no preStop endpoint-propagation wait —
      # this is purely drain headroom. run_worker() cancels the loop on SIGTERM and bounds the
      # cleanup at HIPPIUS_WORKER_DRAIN_TIMEOUT_SECONDS (20s), and that cleanup closing the
      # asyncpg pool is what stops a long statement outliving the pod and pinning the xmin
      # horizon. 40 leaves headroom over the 20s bound.
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: wait-for-services
          image: busybox:1.35
          command:
            - sh
            - -c
            - until nc -z postgres-rw 5432 && nc -z redis 6379 && nc -z redis-queues 6379; do echo waiting for services; sleep 5; done
        # D2: gate on DB migrations. Workers `exec python <script>` with no migrate step of their
        # own (unlike the API, whose start-api.sh runs migrate before uvicorn), so a freshly-rolled
        # worker could start against a schema older than its code and error on a new column/table.
        # This WAITS for the newest baked-in migration to appear in schema_migrations; the API and
        # the db-migrations Job own applying them.
        - name: wait-for-migrations
          image: ghcr.io/thenervelab/hippius-s3/workers:latest
          command:
            - python
            - scripts/wait_for_migrations.py
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
      containers:
        - name: arion-uploader
          image: ghcr.io/thenervelab/hippius-s3/workers:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: hippius-s3-defaults
            - configMapRef:
                name: hippius-s3-environment
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(ENVIRONMENT),service.namespace=$(K8S_NAMESPACE),service.instance.id=$(POD_NAME)"
            - name: OTEL_SERVICE_NAME
              value: "hippius-s3-uploader"
            - name: WORKER_SCRIPT
              value: "workers/run_arion_uploader_in_loop.py"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_URL
            - name: REDIS_QUEUES_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_QUEUES_URL
            - name: HIPPIUS_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_SERVICE_KEY
            - name: ARION_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_SERVICE_KEY
            - name: ARION_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_BEARER_TOKEN
            - name: ARION_BILLING_BYPASS_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_BILLING_BYPASS_KEY
            - name: ARION_RATE_LIMITING_PROXY_BYPASS_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: ARION_RATE_LIMITING_PROXY_BYPASS_KEY
            - name: HIPPIUS_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_AUTH_ENCRYPTION_KEY
            - name: HIPPIUS_ARION_BASE_URL
              value: "HIPPIUS_ARION_BASE_URL_PLACEHOLDER"
            - name: HIPPIUS_ARION_VERIFY_SSL
              value: "HIPPIUS_ARION_VERIFY_SSL_PLACEHOLDER"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DISCORD_WEBHOOK_URL
            - name: HIPPIUS_OVH_KMS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_ENDPOINT
            - name: HIPPIUS_OVH_KMS_DEFAULT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_DEFAULT_KEY_ID
            - name: HIPPIUS_OVH_KMS_OKMS_ID
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_OVH_KMS_OKMS_ID
            - name: FRONTEND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: FRONTEND_HMAC_SECRET
            - name: HIPPIUS_UPLOAD_BACKENDS
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_UPLOAD_BACKENDS
            - name: HIPPIUS_DOWNLOAD_BACKENDS
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_DOWNLOAD_BACKENDS
            - name: HIPPIUS_DELETE_BACKENDS
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_DELETE_BACKENDS
            - name: HIPPIUS_UPLOADER_MAX_INFLIGHT
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_UPLOADER_MAX_INFLIGHT
          volumeMounts:
            - name: object-cache
              mountPath: /var/lib/hippius/object_cache
            - name: kms-certs
              mountPath: /kms_certs
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -d /proc/1 && grep -q python /proc/1/cmdline"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: object-cache
          persistentVolumeClaim:
            claimName: object-cache-pvc
        - name: kms-certs
          secret:
            secretName: ovh-kms-certs
            defaultMode: 0400
---
