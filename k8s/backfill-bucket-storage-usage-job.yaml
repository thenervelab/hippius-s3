# Seed the per-bucket storage rollup, once, after the triggers land.
#
# 20260910120000_storage_usage_rollup.sql creates the triggers, so every byte that moves from that
# moment on is recorded. It does NOT seed the counters — that would be a full scan of the objects
# tables inside a migration transaction, which is exactly the cost this whole change removes from
# the steady state and must not be paid while a deploy waits on it.
#
# Until this Job completes, storage_usage_rollup_state.backfilled_at is NULL, usage_service refuses
# to return a number, and the plans-cacher keeps publishing its previous roll. So the ordering
# migration -> backfill -> (usage read) is enforced by the schema, not by remembering to run this;
# but a plan account's usage figure is frozen until it does run.
#
# DEFAULTS TO A DRY RUN. It reports what each counter would move by and writes nothing. Check the
# totals look like real bucket sizes, then add --apply to the args below.
#
# IMPORTANT: namespace below is hardcoded. Edit between staging and prod runs.
# Run with:   kubectl create -f k8s/backfill-bucket-storage-usage-job.yaml
# Re-run:     kubectl -n <namespace> delete job backfill-bucket-storage-usage \
#               && kubectl create -f k8s/backfill-bucket-storage-usage-job.yaml
# Inspect:    kubectl -n <namespace> logs job/backfill-bucket-storage-usage --follow
#
# Safe to run concurrently with live traffic and safe to run twice: each bucket is recomputed in
# its own transaction, the recompute SETS rather than adds, and it discards that bucket's pending
# ledger rows in the same snapshot it aggregates in. See the script's module docstring.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-bucket-storage-usage
  namespace: hippius-s3-staging
  labels:
    app: backfill-bucket-storage-usage
    mode: dryrun
spec:
  backoffLimit: 0
  # The estate's largest bucket alone is a ~64s aggregate and there are tens of thousands of
  # buckets. Killing the Job part way through is harmless — nothing is marked backfilled until a
  # complete pass finishes, and a re-run converges rather than double-counting.
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: backfill-bucket-storage-usage
        mode: dryrun
    spec:
      restartPolicy: Never
      containers:
        - name: backfill
          # PIN THIS to the short SHA the target environment is actually running before you apply.
          # `latest` is pushed to the SAME GHCR repo by BOTH the staging and production deploy
          # workflows, and this Job sits outside kustomize so `kustomize edit set image` never
          # rewrites it — so `latest` here means "whichever environment deployed most recently",
          # which for a production backfill could be a staging build. Read the running tag with:
          #   kubectl -n <ns> get ds api-local -o jsonpath='{.spec.template.spec.containers[0].image}'
          image: ghcr.io/thenervelab/hippius-s3/api:latest
          imagePullPolicy: Always
          # The WHOLE secret, not just DATABASE_URL. get_config() hard-requires six more
          # secret-only vars with no defaults (FRONTEND_HMAC_SECRET, HIPPIUS_AUTH_ENCRYPTION_KEY,
          # HIPPIUS_SERVICE_KEY, ARION_SERVICE_KEY, ARION_BEARER_TOKEN, REDIS_URL) and the image
          # ships no .env to fall back on, so a DATABASE_URL-only Job died in config parsing before
          # running a single line -- and with backoffLimit: 0 it died once and stayed dead. That
          # would have failed rollout step 2 AFTER step 1 had already put the environment into the
          # degraded pre-backfill state. Matches backfill-superseded-unpins-job.yaml.
          #
          # The secret's own DATABASE_URL already points at the primary (postgres-nvme-rw), which is
          # required: this writes, and its aggregate must share one snapshot with the ledger rows it
          # discards, so a replica cannot serve it.
          envFrom:
            - secretRef:
                name: hippius-s3-secrets
            - configMapRef:
                name: hippius-s3-defaults
            - configMapRef:
                name: hippius-s3-environment
          command:
            - python
            - -m
            - hippius_s3.scripts.backfill_bucket_storage_usage
          args:
            - --dry-run
            # Each recompute takes the rollup's advisory lock, which pauses the compactor for its
            # duration. A small pause between buckets keeps the compactor able to keep up during a
            # long run, and keeps a full-estate scan off the primary's back.
            - --sleep-ms=25
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
