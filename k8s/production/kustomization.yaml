apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hippius-s3-prod

resources:
  - ../base
  - postgres-nvme-objectstore.yaml
  - postgres-nvme-cluster.yaml
  - postgres-nvme-scheduledbackup.yaml
  - gateway-nodeport.yaml
  # Scheduling priority for the ingest tier (used by api-local + drain-agent; harmless before they
  # deploy). Created here so it exists ahead of the ingest pods that reference it. See peer-review B3.
  - s3-ingest-priorityclass.yaml
  # --- hippius-drain (s3-2.1) SSD-ingest tier — ENABLED (overlay 2/3). ---
  # Ingest nodes node1..node5 are prepared (dedicated 3.84 TB /s3-data NVMe, labeled
  # s3-prod-local-ingest=true). allocator-first ordering is handled by the agent/reaper
  # initContainers. Routing is NOT flipped here — that's the full-swap overlay (3/3).
  #
  # ingest-node-labels-production.yaml is the declarative node list but is NOT listed here,
  # and must not be added back. This overlay is applied client-side, which prunes any label
  # absent from the manifest — and staging declares the same Node objects (node2/node3), so
  # the two deploys deleted each other's ingest label (2026-07-22: cost prod 243 stranded
  # parts). The workflow applies that file in its own server-side step with a dedicated
  # --field-manager, which scopes ownership to our label key. That step is UNCONDITIONAL,
  # so the labels land on every prod deploy independently of the resources below.
  - api-local-deployments-production.yaml
  - drain-allocator-deployment.yaml   # singleton; owns the cephor_* schema (deploy first)
  - drain-agent-daemonset.yaml        # one per labelled ingest node
  # The node-local uploader: consumes arion_upload_requests:<node> and reads the node's NVMe.
  # Must be Ready BEFORE the drain image that publishes to node queues rolls, or those
  # queues fill with nobody reading them (the base arion-uploader only reads the global one).
  - arion-uploader-local-daemonset.yaml
  - mpu-reaper-deployment.yaml

patches:
  - path: namespace-patch.yaml
  - path: environment-patch.yaml
  - path: resource-limits.yaml
  - path: redis-tuning.yaml
  - path: ingress-patch.yaml
  - path: services-patch.yaml
  - path: postgres-nvme-initwait-patch.yaml
  # Slice 2: unmount the shared cache. Global pool-era uploader off (node-local
  # remains). Janitor is DB-GC only. Object-pool PVCs are omitted from this overlay
  # (apply does not prune; production-deploy deletes the live claims). JSON patches
  # drop leftover mounts — CI's kustomize panics on `$patch: delete`.
  - path: janitor-db-only.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: janitor
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts
      - op: remove
        path: /spec/template/spec/volumes
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: arion-uploader
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/0

images:
  - name: ghcr.io/thenervelab/hippius-s3/api
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/workers
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/drain
    newTag: latest
