apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hippius-s3-prod

resources:
  - ../base
  - postgres-nvme-objectstore.yaml
  - postgres-nvme-cluster.yaml
  - postgres-nvme-scheduledbackup.yaml
  - gateway-nodeport.yaml
  # --- hippius-drain (s3-2.1) SSD-ingest tier — ENABLED for the cutover. ---
  # Ingest nodes node1..node5 are prepared (dedicated 3.84 TB /s3-data NVMe, labeled
  # s3-prod-local-ingest=true). Allocator-first ordering is handled by the agent/reaper
  # initContainers. Runbook: path-to-prod.md; gated execution: rollout.sh.
  - ingest-node-labels-production.yaml
  - api-local-deployments-production.yaml
  - drain-allocator-deployment.yaml   # singleton; owns the cephor_* schema (deploy first)
  - drain-agent-daemonset.yaml        # one per labelled ingest node
  - mpu-reaper-deployment.yaml

patches:
  - path: namespace-patch.yaml
  - path: environment-patch.yaml
  - path: resource-limits.yaml
  - path: redis-tuning.yaml
  - path: ingress-patch.yaml
  - path: services-patch.yaml
  - path: postgres-nvme-initwait-patch.yaml
  # Cutover routing (full-swap): point the existing `api` Service — the gateway's
  # GATEWAY_BACKEND_URL=http://api:8000 upstream — at the drain-direct api-local fleet, so
  # traffic goes through the normal front door. Base `api` is scaled to 0 in resource-limits.yaml.
  # (Mirrors k8s/staging/kustomization.yaml. For a gated/hybrid shift instead, keep base api and
  # drive the incremental scale + Service repoint with rollout.sh.)
  - target:
      kind: Service
      name: api
    patch: |-
      - op: replace
        path: /spec/selector
        value:
          app: api-local

images:
  - name: ghcr.io/thenervelab/hippius-s3/api
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/gateway
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/workers
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/drain
    newTag: latest
