# The hippius-drain allocator: the singleton, leader-elected budget allocator.
#
# One replica. The allocator does NOT need the SSD/CephFS mounts — it only reads the
# fleet's heartbeats and writes per-node write-budgets. Leadership, heartbeats, and
# budgets are TTL-keyed in redis-queues (epoch-fenced via Lua), NOT Postgres, so the
# ~2s leader tick never touches the WAL. It is still the schema owner: on startup it
# applies the hippius-drain-core migrations (the durable cephor_* tables) before
# contending for leadership, so the agents come up against a ready schema
# (allocator-first deploy). A Redis leader-lease (monotonic epoch) fences any accidental
# second instance, so even a brief rollout overlap allocates from exactly one leader.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drain-allocator
  labels:
    app: drain-allocator
spec:
  replicas: 1
  # One leader at a time: never run an old and a new allocator pod concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: drain-allocator
  template:
    metadata:
      labels:
        app: drain-allocator
    spec:
      # > the allocator tick + lease-relinquish on SIGTERM (graceful handoff).
      terminationGracePeriodSeconds: 40
      containers:
        - name: allocator
          image: ghcr.io/thenervelab/hippius-s3/drain:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/hippius-drain-allocator"]
          env:
            # The lease holder id — the pod name makes a restart a distinct holder.
            - name: CEPHOR_ALLOCATOR_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Reuse the api's DATABASE_URL secret; the cephor_* tables live in the
            # same `hippius` database (distinct table names, no collision).
            - name: CEPHOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
            # Coordination state (leader lease / fleet heartbeats / per-node budgets) lives
            # here, TTL-keyed — the same redis-queues instance the agents use. Reuse the
            # api's secret.
            - name: REDIS_QUEUES_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_QUEUES_URL
            - name: RUST_LOG
              value: "info"
            # OTLP metrics -> otel-collector -> Prometheus -> Grafana (feature `otel`, on by
            # default). service_namespace is what the dashboard's var-namespace filters on.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENVIRONMENT
              value: "production"
            - name: ENABLE_MONITORING
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(ENVIRONMENT),service.namespace=$(K8S_NAMESPACE),service.instance.id=$(POD_NAME)"
            # AIMD write-budget tuning (2026-07-14). The former defaults deadlocked the
            # drain: target_p99=2000ms is compared against a WHOLE-part copy+fsync+verify,
            # which for a 64 MiB part needs >=~41 MB/s/node to stay under 2s — so any dip
            # collapsed the budget to the 1 MB/s min_total floor, and at 0.5 MB/s/node a
            # 64 MiB part takes ~130s, keeping p99 above target permanently (self-reinforcing).
            # Measured live: budget pinned at 1 MB/s, drain fully stalled. Raising the floor
            # above the stability threshold and the p99 target above the real per-part copy
            # time lets the AIMD ramp back up (validated live: budget 0.5 -> 100 MB/s, drain
            # resumed). See drainer-optimisations.md.
            # 2026-08-06: the SAME latch recurred at the RAISED floor. A bulk ingest into one
            # bucket pushed p99 over target, the AIMD floored, and it could not climb back:
            # measured live, the five per-node budgets summed to EXACTLY 50,000,000 (the floor)
            # with observed_p99 17.9-28.4s against the 8s target, for 70+ minutes.
            # Why 50 MB/s is still inside the trap: the budget is split per-node and then across
            # CEPHOR_DRAIN_CONCURRENCY=16 in-flight part copies. 50 MB/s -> 10 MB/s/node ->
            # 0.6 MB/s per stream; a p99 part (3.7 MB; p50 is 320 kB) then needs ~6s of transfer
            # alone, and with queueing lands at the observed 18-28s. p99 > target on EVERY tick,
            # so the additive-increase branch is unreachable and the floor is absorbing.
            # The latency signal therefore measures the throttle's own delay, which is what makes
            # the low state self-sustaining — there are two stable equilibria and load knocks the
            # fleet from the high one into the low one, permanently.
            # 250 MB/s -> 50 MB/s/node -> 3.1 MB/s/stream -> p99 part ~1.2s, comfortably under
            # the 8s target, so ticks read healthy and the AIMD ramps to the ceiling by itself.
            # This does NOT weaken the near-full protection: allocate() applies the ceiling AFTER
            # the floor (`capacity = new_total.min(ceiling.budget())`, alloc.rs), so a NearFull
            # ceiling still clamps the fleet to CEPHOR_CEPH_NEARFULL_RATE_BPS and Critical still
            # yields a zero budget, regardless of how high min_total is set.
            - name: CEPHOR_ALLOC_MIN_TOTAL_BPS
              value: "250000000"   # 250 MB/s floor (was 50 MB/s) — above the 16-way-split collapse threshold
            - name: CEPHOR_ALLOC_TARGET_P99_MS
              value: "8000"        # 8s (was 2s) — headroom over per-part copy under load
            # initial_total defaults to min_total (config.rs), so before this was set every
            # allocator restart began at the floor — i.e. restarting to clear a latch restarted
            # INTO it. Pinned at the per-node ceiling (5 x 100 MB/s) so a fresh leader starts at
            # full rate and backs off only if Ceph actually pushes back.
            - name: CEPHOR_ALLOC_INITIAL_TOTAL_BPS
              value: "500000000"   # 500 MB/s — start at the top, not at the floor
            # Keep 95% per back-off tick instead of 80%. At 800 a four-tick blip (20s) cuts the
            # budget to 41% of its estimate; at 950 the same blip leaves 81%, so a transient Ceph
            # stall no longer dumps the fleet toward the floor before the next healthy tick.
            - name: CEPHOR_ALLOC_DECREASE_PERMILLE
              value: "950"
            # 10 MB/s/tick at a 5s tick needs ~4 minutes to climb from the floor to the ceiling;
            # every second of that is un-drained parts that cross-node GETs cannot read yet.
            - name: CEPHOR_ALLOC_ADDITIVE_INCREASE_BPS
              value: "50000000"    # 50 MB/s per healthy tick — ~25s floor-to-ceiling
            # Live ceph-mgr ceiling probe — ENABLED. The allocator reads the real Ceph
            # pool capacity ceiling from the rook-ceph mgr Prometheus endpoint instead of
            # its static fallback ceiling. Cross-namespace reach to rook-ceph confirmed.
            - name: CEPHOR_CEPH_MGR_METRICS_URL
              value: "http://rook-ceph-mgr.rook-ceph.svc.cluster.local:9283/metrics"
            # Pool-level fullness gate (2026-07-24 incident). The drain's target pool
            # filled to ~98% while the cluster ratio sat at 72% and no OSD had crossed
            # near-full, so the ceiling stayed Open all night. Every pool this stack
            # writes is listed (CephFS data + metadata, and the RBD blockpool backing
            # the Postgres/Redis PVCs); the fullest one gates: NearFull at 85% caps
            # the drain at CEPHOR_CEPH_NEARFULL_RATE_BPS, Critical at 95% stops it.
            - name: CEPHOR_CEPH_POOLS
              value: "ceph-filesystem-data0,ceph-filesystem-metadata,ceph-blockpool"
            # 50 MB/s, not the code-default 10 MB/s (2026-07-24 evening lesson): fresh
            # writes are readable ONLY from their ingest node's SSD until drained, and
            # this workload reads its writes cross-node within seconds. At 10 MB/s the
            # cap sat below live ingest — the backlog grew 0->185 GB in 3h and every
            # cross-node GET of a fresh object 503'd ("parts not ready"). 50 MB/s keeps
            # the backlog draining under NearFull; the 95% Critical stop (zero budget)
            # is the actual pool protection, and the janitor's pool-gated eviction has
            # outpaced a 50 MB/s drain all day. Must stay <= CEPHOR_CEPH_CEILING_BPS
            # (config-enforced) and should move WITH the ceph watermarks if retuned.
            # This is ALSO the rate the fleet decays to while the mgr scrape is failing:
            # a blind probe cannot tell an open pool from a full one, so raising this
            # loosens the blind fail-safe as well as the known-near-full cap.
            - name: CEPHOR_CEPH_NEARFULL_RATE_BPS
              value: "50000000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # The allocator touches this file each tick (~2s); a stale file means a wedged
          # (not crashed) tick loop — e.g. blocked on a hung Redis — so k8s restarts it. A
          # hung leader stops refreshing per-node budgets and the whole fleet decays to
          # floor, so a silent hang must not persist. initialDelay covers startup migrations.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'f=/tmp/hippius-drain-allocator.alive; test -f "$f" && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 30 ]'
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
