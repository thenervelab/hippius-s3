# The hippius-drain agent: the per-node drain daemon.
# One pod per ingest node, draining that node's local-SSD ingest dir to
# the shared CephFS pool, path-preservingly per the api part layout
# (<object_id>/v<version>/part_<n>/). Parts are discovered from the api's landed-part
# announcements (cephor:landed:<node> on the queue Redis); the reconciler's SSD scan is the
# BACKSTOP for an announcement that was never delivered, not the primary trigger.
#
# == Node alignment ==
# Selects the SAME node label `s3-prod-local-ingest=true` as the api-local
# Deployment (the one list lives in ingest-node-labels-production.yaml), so a DaemonSet
# runs exactly one drain pod per node an api pod can land on — in lockstep, no
# duplicated hostname list to drift, and off the cache/psql/master nodes.
#
# == Volumes ==
#  * SSD source: the SAME hostPath the api pods write to — the dedicated /s3-data NVMe
#    on each ingest node (staging uses a different path/disk, local_ingest_staging on the
#    node root, so they don't collide on shared node2/node3). RW so the agent can unlink a
#    part after a verified, committed pool copy.
#  * CephFS pool: object-cache-pvc — ReadWriteMany ceph-filesystem, mounted RW (the api
#    pods mount it read-only; the agent is the writer into ceph).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: drain-agent
  labels:
    app: drain-agent
spec:
  selector:
    matchLabels:
      app: drain-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: drain-agent
    spec:
      # Outrank general workloads for the node1-5 slots so every ingest node running api-local also
      # gets its drain-agent (below system-*-critical; never preempts Ceph/system). See
      # s3-ingest-priorityclass.yaml + peer-review B3.
      priorityClassName: s3-ingest-priority
      # Same label as api-local — keeps them in lockstep (see header).
      nodeSelector:
        s3-prod-local-ingest: "true"
      affinity:
        # Belt-and-suspenders with the nodeSelector label, identical to api-local's
        # allow-list: a drain-agent only runs where an api-local pod can land. Keep in
        # sync with ingest-node-labels-production.yaml + api-local-deployments-production.yaml.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # The prod ingest nodes: dedicated /s3-data NVMe, labeled
                      # s3-prod-local-ingest=true. Keep in sync with
                      # ingest-node-labels-production.yaml + api-local-deployments-production.yaml.
                      # Overlaps staging's node2/node3 but on a different disk (staging uses the
                      # node-root local_ingest_staging path). See s3-2.1-todo.md.
                      - k8s-v3-node1
                      - k8s-v3-node2
                      - k8s-v3-node3
                      - k8s-v3-node4
                      - k8s-v3-node5
      # > the agent's shutdown grace (CEPHOR_GRACE_SECS default 30s): a burst winds
      # down before the kubelet force-kills, so no in-flight part is stranded draining.
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: prepare-ingest-dir
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /var/lib/hippius/local_object_cache && chmod 0777 /var/lib/hippius/local_object_cache
          volumeMounts:
            - name: local-ingest
              mountPath: /var/lib/hippius/local_object_cache
        # Block until the allocator has provisioned the cephor_* schema (it owns the
        # migrations). Without this gate a fresh-namespace `apply` lets the agent start
        # against missing tables and CrashLoop until the allocator catches up. Strengthens
        # mpu-reaper's port-check to an actual schema check (to_regclass is NULL, not an
        # error, for an absent table).
        - name: wait-for-cephor-schema
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-nvme-rw -p 5432; do echo "waiting for postgres"; sleep 3; done
              # Gate on the columns THIS binary needs, not on the table existing. The table has
              # been there since migration 0005, so the old check passed instantly and guarded
              # nothing — while `record_landed_part` (the only record path, so the landed queue
              # AND the reconciler backstop fail together) needs 0019's content_sha256 and
              # relanded_at, `mark_replicated` needs content_sha256, and the evictor's worklist
              # needs 0016's cephor_ssd_residency. Started against a pre-migration schema the
              # agent cannot commit or record ANY part while the api keeps accepting PUTs onto
              # the same SSD, and it does not self-heal until the allocator's migration lands.
              # table_schema is load-bearing, and count(DISTINCT ...) with it. Without both,
              # information_schema.columns spans EVERY schema the role can see, so the check
              # answers the wrong question twice over: a same-named table in another schema
              # (an archive, a restore staging area) can supply the missing columns and pass the
              # gate against an un-migrated `public` — the exact outage it exists to prevent —
              # and a duplicate of a CORRECTLY migrated table makes the count 6, so `= 3` is
              # false and the initContainer spins forever on a healthy database.
              until [ "$(psql "$CEPHOR_DATABASE_URL" -tAc "
                SELECT to_regclass('public.cephor_ssd_residency') IS NOT NULL
                   AND EXISTS (SELECT 1 FROM information_schema.columns
                               WHERE table_schema = 'public'
                                 AND table_name = 'cephor_replication_status'
                                 AND column_name IN ('content_sha256', 'relanded_at', 'reclaimed_at')
                               HAVING count(DISTINCT column_name) = 3)")" = "t" ]; do
                echo "waiting for the cephor schema (allocator migrations 0016-0019)"; sleep 3
              done
          env:
            - name: CEPHOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
      containers:
        - name: agent
          image: ghcr.io/thenervelab/hippius-s3/drain:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/hippius-drain-agent"]
          env:
            # NodeId keys this node's heartbeat in the fleet; the k8s node name is
            # stable and unique per node.
            - name: CEPHOR_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Reuse the api's DATABASE_URL secret (cephor_* tables share the `hippius` DB).
            - name: CEPHOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: DATABASE_URL
            # Source (node-local SSD ingest) and destination (shared ceph pool) —
            # mounted at the same paths the api uses, so the relative part dirs line up.
            - name: CEPHOR_SSD_ROOT
              value: /var/lib/hippius/local_object_cache
            - name: CEPHOR_POOL_ROOT
              value: /var/lib/hippius/object_cache
            # The drain is the sole upload producer (s3-2.1 drain-direct): once a part is
            # replicated to ceph it pushes an UploadChainRequest to {backend}_upload_requests
            # for each configured backend. Reuse the api's queue-Redis + upload-backend list.
            - name: REDIS_QUEUES_URL
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: REDIS_QUEUES_URL
            # Sourced from the shared secret (like every Python worker), NOT a literal:
            # the drain is the sole upload producer, so if a backup backend is added to the
            # secret the drain must fan out to it too — a hardcoded "arion" would silently
            # under-replicate (never enqueue the new backend, so the janitor replication gate
            # never clears -> unbounded cache growth).
            - name: HIPPIUS_UPLOAD_BACKENDS
              valueFrom:
                secretKeyRef:
                  name: hippius-s3-secrets
                  key: HIPPIUS_UPLOAD_BACKENDS
            # SSD-ingest reclaim worker: clean up broken/abandoned uploads (failed parts
            # the drain skips forever), replicated crash-orphans (a crash between the
            # mark_replicated commit and the drain's own unlink), and orphan write-temps,
            # once aged, so junk does not accumulate on the node-local disk.
            #
            # 3600, not the 300s code default, for the SAME reason the reconcile poll above is
            # 600: this worker still runs the full SSD tree walk (`reclaim_ssd` ->
            # `scanner.scan_parts()`), and retention grew that tree from the undrained backlog to
            # this node's ENTIRE replicated shard — the 2.28M parts / ~930 GB measured on prod
            # 2026-08-07. At 300s that is 12 walks/hour per node, on the same NVMe serving ingest
            # and reads, i.e. twice the frequency of the reconcile walk this release just demoted
            # 40x for being too expensive. `ssd_reclaim.rs` already reasons about an hourly walk.
            #
            # Every disposition this worker owns is grace-gated at >= 1h
            # (CEPHOR_RECLAIM_GRACE_SECS below), so no part becomes actionable faster than hourly
            # and a 300s poll could only re-ask the same question twelve times.
            #
            # That was NOT true while the R4 corrupt re-drive shared this loop. A `corrupt` part
            # is a live object whose pool copy is bad and whose SSD copy is the last good source,
            # and it has no grace — so for that one call the poll interval was the single-copy
            # exposure window, and raising this to 3600 would have widened it 12x. The re-drive
            # now runs on its own worker and its own CEPHOR_REDRIVE_POLL_SECS below; the two must
            # stay separate, and this value must not be assumed to bound anything R4.
            - name: CEPHOR_RECLAIM_POLL_SECS
              value: "3600"
            # Pinned at the historical 5 minutes, and pinned EXPLICITLY rather than left to the
            # code default so that this window is visible next to the walk interval it used to be
            # accidentally coupled to. `drain-corrupt-live-parts` (severity critical, for: 15m) is
            # calibrated against this cadence — 15m is three cycles here, which is what lets a
            # transient corruption clear itself before paging. Raising it breaks that calibration.
            - name: CEPHOR_REDRIVE_POLL_SECS
              value: "300"
            - name: CEPHOR_RECLAIM_GRACE_SECS
              value: "3600"
            # ROLLBACK-LOAD-BEARING — do not delete as manifest hygiene.
            # Read by the CURRENT (pre-retention) binary, which unlinks a replicated part once
            # it ages past this grace. The retention binary ignores it: ssd_reclaim skips
            # `replicated` outright, because those parts are the read tier and the evictor owns
            # them instead. It looks dead the moment retention ships here — and it is exactly
            # then that it matters most, because `kubectl rollout undo daemonset/drain-agent`
            # restores unlink-on-commit AND needs this grace to sweep the cache the rolled-back
            # fleet is still holding. Deleting it would leave a rolled-back node with a full
            # disk and nothing to reclaim it.
            - name: CEPHOR_REPLICATED_RECLAIM_GRACE_SECS
              value: "3600"
            # Max parts drained concurrently — the in-flight gate that lets the node
            # overlap fsync latency across parts (the AIMD allocator only tunes bytes/s).
            # Safe code default (4); set here for per-node tuning.
            - name: CEPHOR_DRAIN_CONCURRENCY
              value: "16"    # was 4 — overlap more per-part commit fsyncs (the drain is
                             # commit-bound on the ceph-backed Postgres, ~0.68 parts/s at 4);
                             # more concurrency is the main lever until the status DB moves off
                             # ceph-backed storage. See drainer-optimisations.md.
            # Replication-lag tuning (measured 2026-07-02: p50 4.6s / p99 5.9s under the old 5s
            # poll). The lag was NOT the drain budget (unpinned to ~1 GB/s by the target_p99 fix)
            # — it was the poll floor. Lower ONLY the poll:
            #   the claim query is a partial-index (node_id, landed_at) WHERE status='pending'
            #   lookup, so 1s polling scans only the small active-pending set, not the ~94M-row
            #   parts table — unconditionally cheap even at prod scale.
            # CEPHOR_DEFER_BACKOFF_SECS is deliberately left at its 5s code default. Since the
            # 2026-07-26 head-of-line fix it is the BASE of a per-part EXPONENTIAL backoff: a
            # not-yet-drainable part (MPU whose Complete hasn't written object_versions.address,
            # or a stuck A21 orphan) re-parks for base × 2^defer_attempts — 5s, 10s, 20s, … —
            # capped by CEPHOR_DEFER_BACKOFF_CAP_SECS (code default 600). A chronic wall thus
            # escalates out of the oldest-first claim head instead of churning it, while still
            # re-checking within minutes; CompleteMultipartUpload clears the backoff (deferred_until
            # AND defer_attempts), so a just-completed MPU's parts drain promptly regardless.
            - name: CEPHOR_DRAIN_POLL_SECS
              value: "1"
            # Reconciler scan period — the BACKSTOP for a lost landed announcement, not the
            # drain trigger. Primary discovery is the api's cephor:landed:<node> announcement,
            # drained every 1s (landed.rs); this walk only recovers a part whose announcement
            # was never delivered, so its interval bounds nothing but that recovery lag. An
            # unrecovered part waits safely on SSD in the meantime: with no DB row the evictor
            # never selects it, and the orphan reclaim grace is 24h.
            #
            # 600 (was 15): retention (PR #398) turns the walked tree from the small undrained
            # backlog into the node's ENTIRE replicated shard — measured 2026-08-07 at 2.28M
            # parts / ~930 GB per node, i.e. ~2.28M stats + ~4,560 batched status queries per
            # cycle. At 15s that walk would run 4x a minute per node from the moment retention
            # lands; at 600s it runs 6x an hour (a 40x reduction) while a dropped announcement
            # still recovers within the ~10min backstop the 2026-08-07 note planned. 600s also
            # matches the code's own backstop scale (CEPHOR_DEFER_BACKOFF_CAP defaults to 600s)
            # and is 10x the 60s code default set back when this walk was the sole — and cheap —
            # trigger. Watch drain_scan_parts_total / drain_scan_duration_ms.
            #
            # ORDERING CONSTRAINT (closed): PR #400's review gated promoting retention to prod
            # on this demotion landing first. Done here, on the staging branch, ahead of the
            # retention stack's promotion — so it rides the same staging->main train as
            # retention and prod can never receive retention without it. Staging deliberately
            # keeps 15s (see k8s/staging/drain-agent-daemonset.yaml for why).
            - name: CEPHOR_RECONCILE_POLL_SECS
              value: "600"
            - name: RUST_LOG
              value: "info"
            # OTLP metrics -> otel-collector -> Prometheus -> Grafana (feature `otel`, on by
            # default). The collector turns these resource attrs into Prometheus labels; the
            # dashboard's var-namespace filters on service_namespace, so drain_* series land
            # under the staging namespace. Mirrors the janitor deployment's env.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENVIRONMENT
              value: "production"
            - name: ENABLE_MONITORING
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(ENVIRONMENT),service.namespace=$(K8S_NAMESPACE),service.instance.id=$(POD_NAME)"
          volumeMounts:
            - name: local-ingest
              mountPath: /var/lib/hippius/local_object_cache
            - name: object-cache
              mountPath: /var/lib/hippius/object_cache
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # The agent touches this file each heartbeat tick (~10s); a stale file means a
          # wedged (not crashed) runtime — e.g. a broken redis ConnectionManager — so k8s
          # restarts the pod. The agent is the sole upload producer, so a silent hang would
          # otherwise stop this node's uploads with no recovery.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'f=/tmp/hippius-drain-agent.alive; test -f "$f" && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 40 ]'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # C8: NotReady when the drain is WEDGED — a hung CephFS write stalls draining while
          # liveness (process-alive) stays fresh. The agent touches this file only while the drain
          # is PROGRESSING (or idle); a wedged loop lets it go stale. Unlike liveness this does NOT
          # restart the pod (a wedge is not a crash) — it marks the node NotReady so a rolling
          # update does not step over stuck nodes and the wedge surfaces in pod status.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'f=/tmp/hippius-drain-agent.ready; test -f "$f" && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 45 ]'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: local-ingest
          hostPath:
            # The dedicated 3.84 TB NVMe mounted at /s3-data on each ingest node (node1..node5).
            # type: Directory (NOT DirectoryOrCreate as on staging) is deliberate: if the NVMe is
            # not mounted at /s3-data the pod stays ContainerCreating instead of silently writing
            # the ingest churn onto the node root disk and filling it.
            path: /s3-data
            type: Directory
        - name: object-cache
          persistentVolumeClaim:
            claimName: object-cache-pvc
