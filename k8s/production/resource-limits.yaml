apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-uploader
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: arion-uploader
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-unpinner
spec:
  template:
    spec:
      containers:
        - name: arion-unpinner
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 1Gi
---
