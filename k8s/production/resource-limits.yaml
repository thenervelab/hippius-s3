apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-uploader
spec:
  replicas: 10
  template:
    spec:
      containers:
        - name: arion-uploader
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-downloader
spec:
  replicas: 10
  template:
    spec:
      containers:
        - name: arion-downloader
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arion-unpinner
spec:
  template:
    spec:
      containers:
        - name: arion-unpinner
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-cacher
spec:
  template:
    spec:
      containers:
        - name: account-cacher
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janitor
spec:
  template:
    spec:
      containers:
        - name: janitor
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-cache-pvc
spec:
  resources:
    requests:
      # Grown 9728Gi -> 16Ti for the s3-2.1 cutover: this CephFS RWX pool becomes the shared
      # READ cache once the node6 40 TB local cache (9.1 TB hot working set) is retired — the
      # write-hot set moves to per-node /s3-data NVMe, but the read-hot 24 h retention lands here.
      # Online expansion (ceph-filesystem allowVolumeExpansion=true); actual usage stays bounded by
      # the janitor GC, so this is headroom. Pool has ~14 TiB MAX AVAIL, Ceph ~34% used. Never shrink.
      storage: 16384Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persist-pvc
spec:
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dlq-pvc
spec:
  resources:
    requests:
      storage: 20Gi
