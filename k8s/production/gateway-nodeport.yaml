apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  labels:
    app: api-local
spec:
  type: NodePort
  selector:
    app: api-local
    # Only merged-image pods carry this label — see the DaemonSet template comment.
    hippius.io/edge: "true"
  ports:
    - port: 8080
      targetPort: 8000
      protocol: TCP
      name: http
      nodePort: 30081
