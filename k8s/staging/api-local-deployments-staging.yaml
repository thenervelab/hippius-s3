# Trial (s3-2.0 prototype): the entire staging api fleet on node-local SSD.
#
# A single `api-local` DaemonSet — exactly one pod per ingest node. The base (ceph) `api` deployment
# is scaled to 0 in resource-limits.yaml, so ALL api pods run on local SSD. Each
# pod writes to its node's local dir and read-falls-back to the shared CephFS
# cache. All workers stay on ceph, untouched.
#
# Volume: a `hostPath` with `type: DirectoryOrCreate` — the kubelet creates the
# node path on whatever node the pod lands on (NO manual node prep, so this deploys
# cleanly via CI). A root initContainer chmods it so the api (which may run
# non-root) can write. This replaces the earlier local-PV approach, which required
# pre-creating the dir on each node (impossible in CI).
#
# The node path is /var/lib/hippius/local_ingest_STAGING (the `_staging` denominator
# matters: staging + prod share the cluster, and prod uses /var/lib/hippius/local_ingest_prod
# — so even if a staging and a prod pod land on the same node, their local disks
# never collide).
#
# Scheduling: pinned to nodes labeled `s3-staging-local-ingest=true` (the ONE list
# lives in ingest-node-labels-staging.yaml). The drain-agent DaemonSet selects
# the SAME label, so they stay in lockstep. Being a DaemonSet, exactly one api-local
# runs per labelled node — no soft anti-affinity that lets replicas cluster (in prod
# the Deployment form left two nodes with an idle NVMe while two others ran two pods
# on one SSD; see PR #302). A required nodeAffinity hostname allow-list
# (node2/node3) is belt-and-suspenders WITH the label: a stray/mislabeled node alone
# can't place ingest on a psql/cache node — the hostname must ALSO be on the list.
#
# Routing: the existing `api` Service (the gateway's GATEWAY_BACKEND_URL=
# http://api:8000 upstream) is patched to select `app: api-local`
# (kustomization.yaml), so the gateway routes here through the normal front door.
#
# IMPORTANT: with no ceph api pods, every upload stages locally and stays
# `pending` until the replicator copies local->ceph. Install + test the replicator
# when ready. See README-local-ingest-trial.md.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: api-local
  labels:
    app: api-local
spec:
  # DaemonSet: exactly one api-local per labelled ingest node, co-located with the drain-agent
  # DaemonSet so every node's local writer has its sole drain producer on the same host.
  # Auto-scales when an ingest node is added/removed (no replicas knob to keep in sync).
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api-local
  template:
    metadata:
      labels:
        app: api-local
        # Rollout-safety latch for the gateway/api merge: the public-facing Services
        # (gateway-nodeport, gateway alias) select on this label IN ADDITION to
        # app: api-local, so pods from the pre-merge image — which perform no
        # authentication of their own — can never receive public traffic while the
        # DaemonSet is still rolling. Inert once the fleet is on the merged image.
        hippius.io/edge: "true"
    spec:
      # STAGING TRIAL (2026-08-20): run on the node's network stack instead of the
      # calico/VXLAN pod network. Measured on these nodes: the overlay delivers
      # ~1450-byte packets into the pod with no GRO coalescing, capping ANY app
      # (nc, bare asyncio, uvicorn alike) at ~150-176 MB/s per connection, while
      # the same receiver on the host network does 463+ MB/s (physical-NIC GRO
      # hands the loop ~64KB segments). hostNetwork removes veth+vxlan from every
      # ingested byte. NodePort 30080 semantics are unchanged (endpoints become
      # nodeIP:8000; externalTrafficPolicy: Local holds trivially).
      # Trade-off, signed off in PR: calico NetworkPolicies do not apply to
      # hostNetwork pods. Acceptable here: every route does in-process auth since
      # the gateway/api merge (#420), and UVICORN_HOST below binds the internal
      # address only instead of 0.0.0.0.
      hostNetwork: true
      # Mandatory with hostNetwork: keep CLUSTER DNS, otherwise the pod inherits
      # the node's resolv.conf and every in-cluster service name (postgres-rw,
      # redis-*) stops resolving.
      dnsPolicy: ClusterFirstWithHostNet
      # 10s preStop + up to 25s uvicorn drain, with headroom before the kubelet SIGKILLs.
      terminationGracePeriodSeconds: 45
      nodeSelector:
        s3-staging-local-ingest: "true"
      affinity:
        # Belt-and-suspenders with the nodeSelector label: even a mislabeled node
        # can't host ingest unless its hostname is ALSO on this allow-list. Keep in
        # sync with ingest-node-labels-staging.yaml (the label list).
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-v3-node2
                      - k8s-v3-node3
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - until pg_isready -h postgres-rw -p 5432 -U postgres; do echo waiting for postgres; sleep 5; done
        - name: prepare-ingest-dir
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /var/lib/hippius/local_object_cache && chmod 0777 /var/lib/hippius/local_object_cache
          volumeMounts:
            - name: local-ingest
              mountPath: /var/lib/hippius/local_object_cache
      containers:
        - name: api
          image: ghcr.io/thenervelab/hippius-s3/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hippius-s3-defaults
            - configMapRef:
                name: hippius-s3-environment
            - secretRef:
                name: hippius-s3-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Which node this pod runs on. A promoted chunk is claimed for this node in
            # cephor_ssd_residency so the drain-agent evictor on the SAME node can reclaim
            # it; without an identity there is no recorder and promotion stays off.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # With hostNetwork, status.podIP IS the node's vRack address, so peers
            # register and address each other by node IP. The registry's pod-network
            # allow-list is extended for exactly this shape by the flag below — sound
            # because one api owns :8000 per node (no SNAT ambiguity) and peer requests
            # still authenticate via the shared-secret header.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HIPPIUS_PEER_ALLOW_NODE_NETWORK
              value: "true"
            # Bind the node's internal address only, never 0.0.0.0: NodePort DNAT,
            # kubelet probes, and peer fetches all target this same hostIP, so
            # nothing else is needed.
            - name: UVICORN_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Read a chunk from the peer node holding it on flash (~6 ms + ~1 ms network)
            # before falling through to the CephFS pool (~40 ms). Staging only.
            - name: HIPPIUS_PEER_FETCH_ENABLED
              value: "true"
            # The other half of the tier: without this the route is not mounted, every peer
            # fetch 404s, and the tier is dark while FETCH_ENABLED above still says it is on.
            # It is a separate flag on purpose (see config.py) — fetch governs what this pod
            # reads, serve what it hands out — so enabling one does not enable the other.
            # Mounting is gated on this AND a non-empty HIPPIUS_INTERNAL_PEER_SECRET, which
            # arrives from the hippius-s3-secrets envFrom above.
            - name: HIPPIUS_PEER_SERVE_ENABLED
              value: "true"
            # Warm this node's flash from whatever it had to read remotely, so a repeat read
            # is local. Requires NODE_NAME (above) to claim residency for the evictor.
            - name: HIPPIUS_OBJECT_CACHE_PROMOTE_ON_READ
              value: "true"
            # Never promote parts above the edge's part-spread threshold. haproxy keeps every
            # request for a key on the key's node and spreads UploadPart partNumber > N across
            # the ingest nodes; a read of a spread object peer-fetches its tail from the
            # owners, and promoting that tail onto the key node would undo the spread on the
            # first read. MUST EQUAL haproxy's N — change both together.
            - name: HIPPIUS_PROMOTE_MAX_PART_NUMBER
              value: "200"
            # Per-peer fanout caps. A part that is hot and resident on ONE node otherwise
            # draws every other node's fetches onto that node's api pod — the same uvicorn
            # serving its own ingest. The client cap bounds what one pod sends; the serve cap
            # sheds with 503 so five pods each within their own cap still cannot crowd out
            # that node's PUTs.
            #
            # The client cap must be >= HTTP_STREAM_PREFETCH_CHUNKS (16). Every chunk of one
            # PART resolves to the same peer, so at the previous value of 8 a single reader
            # shed half its own prefetch window to CephFS while the peer sat idle — and booked
            # it as `client_cap`, which reads as contention on the dashboard. The api floors
            # this at the prefetch depth anyway (effective_max_inflight); set correctly here
            # so the manifest states the intent rather than relying on the correction.
            - name: HIPPIUS_PEER_FETCH_MAX_INFLIGHT
              value: "16"
            # (nodes-1) x per-peer fetch cap: every other node may have a full fetch window
            # in flight against this one, and a fresh (unreplicated) part has no pool copy
            # for a 503-shed reader to fall to.
            - name: HIPPIUS_PEER_SERVE_MAX_INFLIGHT
              value: "64"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=$(ENVIRONMENT),service.namespace=$(K8S_NAMESPACE),service.instance.id=$(POD_NAME)"
            - name: HIPPIUS_OBJECT_CACHE_DIR
              value: /var/lib/hippius/local_object_cache
            - name: HIPPIUS_OBJECT_CACHE_FALLBACK_DIR
              value: /var/lib/hippius/object_cache
          volumeMounts:
            - name: local-ingest
              mountPath: /var/lib/hippius/local_object_cache
            - name: object-cache
              mountPath: /var/lib/hippius/object_cache
              readOnly: true
            - name: persist
              mountPath: /var/lib/hippius/persist
            - name: dlq
              mountPath: /tmp/hippius_dlq
            - name: kms-certs
              mountPath: /kms_certs
              readOnly: true
          # Kept in step with production: failureThreshold x periodSeconds already grants 200s
          # for a slow start, so a long initialDelay only adds dead time to every rollout.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          # See the note in k8s/base/api-deployment.yaml: keeps this pod serving while
          # endpoint removal propagates, so SIGTERM lands only after traffic has moved off.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
      volumes:
        - name: local-ingest
          hostPath:
            path: /var/lib/hippius/local_ingest_staging
            type: DirectoryOrCreate
        - name: object-cache
          persistentVolumeClaim:
            claimName: object-cache-pvc
        - name: persist
          persistentVolumeClaim:
            claimName: persist-pvc
        - name: dlq
          persistentVolumeClaim:
            claimName: dlq-pvc
        - name: kms-certs
          secret:
            secretName: ovh-kms-certs
            defaultMode: 0400
