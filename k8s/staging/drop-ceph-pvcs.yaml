# Staging no longer mounts these CephFS claims. Delete them with the overlay so
# the namespace stops holding the shared cache / leftover persist+dlq volumes.
# Postgres and Redis stay on ceph-filesystem — those are data services, not the
# object pool.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-cache-pvc
$patch: delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persist-pvc
$patch: delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dlq-pvc
$patch: delete
