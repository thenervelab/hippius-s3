apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hippius-s3-staging

resources:
  - ../base
  - gateway-nodeport.yaml
  - postgres-cluster.yaml
  - postgres-scheduledbackup.yaml
  - postgres-objectstore.yaml
  # s3-2.0 trial: node-local-SSD ingest tier (see README-local-ingest-trial.md).
  # Uses a hostPath (DirectoryOrCreate) volume — no PV/PVC, no manual node prep.
  #
  # ingest-node-labels-staging.yaml is the ONE list of ingest nodes, but it is
  # DELIBERATELY NOT listed here. This overlay is applied client-side, which prunes any
  # label absent from the manifest — and prod declares the same Node objects, so the two
  # deploys deleted each other's ingest label (2026-07-22: cost prod 243 stranded parts).
  # The workflow applies that file in its own server-side step with a dedicated
  # --field-manager, which scopes ownership to our label key. Do not re-add it here.
  - api-local-deployments-staging.yaml
  # hostNetwork trial companion: without it the CNI drops the hostnet pod's own
  # connections to postgres/redis/otel (see the file's header comment).
  - networkpolicy-ingest-hostnet.yaml
  # The hippius-drain stack: the singleton allocator (also the cephor_* schema owner)
  # and the per-ingest-node drain agent DaemonSet. Both use the `drain` image.
  - drain-allocator-deployment.yaml
  - drain-agent-daemonset.yaml
  # The node-local uploader: consumes arion_upload_requests:<node> and reads the node's local
  # ingest dir. Must be Ready before the drain image that publishes to node queues rolls.
  - arion-uploader-local-daemonset.yaml
  # Auto-aborts abandoned multipart uploads so the drain stops re-deferring their
  # never-finalized parts (uses the `workers` image; DB + redis-queues only).
  - mpu-reaper-deployment.yaml

patches:
  - path: namespace-patch.yaml
  - path: environment-patch.yaml
  - path: resource-limits.yaml
  - path: services-patch.yaml
  # Slice 2: unmount the shared cache. Global pool-era uploader off (node-local
  # remains). Janitor is DB-GC only. The three CephFS claims (object-cache,
  # persist, dlq) are deleted with this overlay.
  - path: arion-uploader-scale.yaml
  - path: janitor-db-only.yaml
  - path: drop-ceph-pvcs.yaml

images:
  - name: ghcr.io/thenervelab/hippius-s3/api
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/workers
    newTag: latest
  - name: ghcr.io/thenervelab/hippius-s3/drain
    newTag: latest
