apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-cacher
spec:
  template:
    spec:
      containers:
        - name: account-cacher
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
