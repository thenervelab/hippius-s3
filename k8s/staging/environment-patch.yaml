apiVersion: v1
kind: ConfigMap
metadata:
  name: hippius-s3-environment
data:
  ENVIRONMENT: "staging"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=staging,service.namespace=hippius-s3-staging"
  SENTRY_DSN: "SENTRY_DSN_PLACEHOLDER"
  # Harbor unique 1 GiB (2026-08-25): 4 workers left 16 concurrent 64 MiB digest
  # PUTs sharing 8 event loops; mpu_part stream sat idle 8-10s. 8 workers made
  # stream max 863ms. Pool 8 keeps 8*8*2 pods = 128 under staging PG 200.
  UVICORN_WORKERS: "8"
  API_DB_POOL_MAX_SIZE: "8"
